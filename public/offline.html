<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Bağlantı yok · Atlas AI</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      main { width: 100%; max-width: 380px; text-align: center; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 14px; background: #6366f1; color: #fff;
        font-size: 26px; font-weight: 700;
      }
      h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
      p { margin: 0 0 24px; font-size: 16px; line-height: 1.5; color: #a1a1aa; }
      button {
        width: 100%; min-height: 48px; border: 0; border-radius: 10px;
        background: #6366f1; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #818cf8; }
      small { display: block; margin-top: 16px; font-size: 14px; color: #71717a; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <h1>İnternet bağlantısı yok</h1>
      <p>Atlas'ı kullanmak için bağlantı gerekiyor. Bağlantınızı kontrol edip tekrar deneyin.</p>
      <button type="button" onclick="location.reload()">Tekrar Dene</button>
      <small>Bu ekran çevrimdışıyken gösterilir; hiçbir taslak veya işlem cihazda saklanmaz.</small>
    </main>
    <script>
      // Return to the app automatically when the connection comes back.
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
